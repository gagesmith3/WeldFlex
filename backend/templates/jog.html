{% extends "base.html" %}
{% from "components/ui.html" import action_button with context %}

{% block body %}
<div class="jog-page">

  <div class="jog-settings-bar" id="jog-settings">
    <div class="jog-setting-field">
      <label>Frame</label>
      <input type="hidden" id="cartesian_frame" name="cartesian_frame" value="base">
      <div class="jog-seg-group" id="jog-frame-group">
        <button type="button" class="btn jog-seg-btn active" onclick="jogSetFrame(this,'base')">Base</button>
        <button type="button" class="btn jog-seg-btn" onclick="jogSetFrame(this,'tool')">Tool</button>
        <button type="button" class="btn jog-seg-btn" onclick="jogSetFrame(this,'workpiece')">Workpiece</button>
      </div>
    </div>
    <div class="jog-setting-field">
      <label for="cartesian_step">Step (mm / deg)</label>
      <input id="cartesian_step" name="cartesian_step" type="text"
             value="5" inputmode="none" data-kbd="num">
    </div>
    <div class="jog-setting-field">
      <label for="jog_velocity">Velocity (%)</label>
      <input id="jog_velocity" name="jog_velocity" type="text"
             value="20" inputmode="none" data-kbd="num">
    </div>
  </div>

  <div class="jog-pos-bar"
       hx-get="/ui/jog/status"
       hx-trigger="load, every {{ status_interval_ms or 1000 }}ms"
       hx-swap="innerHTML"></div>

  <div class="jog-axis-grid">
    {% for label, axis in [('X','x'),('Y','y'),('Z','z'),('Rx','rx'),('Ry','ry'),('Rz','rz')] %}
    <div class="jog-axis-card">
      <span class="jog-axis-tag">{{ label }}</span>
      <div class="jog-axis-btns">
        <button class="btn jog-btn jog-neg" type="button"
                data-axis="{{ axis }}" data-direction="negative">−</button>
        <button class="btn jog-btn jog-pos" type="button"
                data-axis="{{ axis }}" data-direction="positive">+</button>
      </div>
    </div>
    {% endfor %}
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function jogSetFrame(btn, value) {
  document.getElementById('cartesian_frame').value = value;
  document.querySelectorAll('#jog-frame-group .jog-seg-btn').forEach(function(b) {
    b.classList.toggle('active', b === btn);
  });
}

(function () {
  var _jogging = false;
  var _jogBtn  = null;

  function buildBody(btn) {
    var p = new URLSearchParams();
    p.append('mode',            'cartesian');
    p.append('cartesian_frame', document.getElementById('cartesian_frame').value);
    p.append('cartesian_step',  document.getElementById('cartesian_step').value);
    p.append('jog_velocity',    document.getElementById('jog_velocity').value);
    p.append('axis',            btn.dataset.axis);
    p.append('direction',       btn.dataset.direction);
    return p;
  }

  function sendStop() {
    fetch('/ui/jog/stop', { method: 'POST' }).catch(function () {});
  }

  // Ping-pong loop: send one step, wait for robot ack, then repeat if still held.
  // This prevents request queue buildup and lets stop arrive cleanly.
  function jogLoop() {
    if (!_jogging || !_jogBtn) return;
    fetch('/ui/jog/move', { method: 'POST', body: buildBody(_jogBtn) })
      .then(function (res) {
        if (res.ok) { jogLoop(); }
        else        { stopJog(); }
      })
      .catch(function () { stopJog(); });
  }

  function startJog(btn) {
    if (_jogging) return;
    _jogging = true;
    _jogBtn  = btn;
    btn.classList.add('is-jogging');
    jogLoop();
  }

  function stopJog() {
    if (!_jogging) return;
    _jogging = false;
    if (_jogBtn) { _jogBtn.classList.remove('is-jogging'); _jogBtn = null; }
    sendStop();
  }

  // Jog buttons — pointerdown starts, release anywhere stops
  document.querySelectorAll('.jog-btn').forEach(function (btn) {
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault(); // suppress context-menu / text-select on long-press
      startJog(btn);
    });
  });

  document.addEventListener('pointerup',     function () { if (_jogging) stopJog(); });
  document.addEventListener('pointercancel', function () { if (_jogging) stopJog(); });

  // E-STOP in the header also halts jog
  document.addEventListener('click', function (e) {
    if (e.target.closest('.estop-btn')) stopJog();
  });
})();
</script>
{% endblock %}
