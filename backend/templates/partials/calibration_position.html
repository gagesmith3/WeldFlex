{% if ok %}
<div class="pos-grid">
  <div class="pos-cell"><span>X</span><strong>{{ pose.x }}&thinsp;mm</strong></div>
  <div class="pos-cell"><span>Y</span><strong>{{ pose.y }}&thinsp;mm</strong></div>
  <div class="pos-cell"><span>Z</span><strong>{{ pose.z }}&thinsp;mm</strong></div>
  <div class="pos-cell"><span>Rx</span><strong>{{ pose.rx }}&thinsp;°</strong></div>
  <div class="pos-cell"><span>Ry</span><strong>{{ pose.ry }}&thinsp;°</strong></div>
  <div class="pos-cell"><span>Rz</span><strong>{{ pose.rz }}&thinsp;°</strong></div>
</div>
{% else %}
<div class="pos-offline">Robot offline — {{ error }}</div>
{% endif %}
