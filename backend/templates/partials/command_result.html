<div class="toast toast-{{ 'ok' if ok else 'error' }}" id="active-toast">
  <span class="toast-dot"></span>
  <div class="toast-body">
    <strong class="toast-title">{{ title }}: {{ 'OK' if ok else 'Failed' }}</strong>
    {% if not ok and payload.error is defined %}
    <p class="toast-msg">{{ payload.error }}</p>
    {% endif %}
  </div>
</div>
<script>
(function(){
  var t = document.getElementById('active-toast');
  if (!t) return;
  var isError = t.classList.contains('toast-error');
  var dismissMs = isError ? 9000 : 3500;
  var clearMs = dismissMs + 600;
  // Remove this toast only — never clear the whole rack by id. Two commands
  // within one dwell would otherwise have the first toast's stale timer wipe
  // the second, and a page that swaps this partial somewhere other than
  // #toast-rack would leave the faded-out node in the DOM forever.
  setTimeout(function(){ t.classList.add('toast-dismiss'); }, dismissMs);
  setTimeout(function(){ t.remove(); }, clearMs);
})();
</script>
