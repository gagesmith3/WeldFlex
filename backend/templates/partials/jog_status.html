{% for label, value in [
    ('X',  snapshot.tcp_pose_labels[0]),
    ('Y',  snapshot.tcp_pose_labels[1]),
    ('Z',  snapshot.tcp_pose_labels[2]),
    ('Rx', snapshot.tcp_pose_labels[3]),
    ('Ry', snapshot.tcp_pose_labels[4]),
    ('Rz', snapshot.tcp_pose_labels[5])] %}
<div class="jog-pos-cell">
  <span>{{ label }}</span>
  <strong>{{ value }}</strong>
</div>
{% endfor %}
