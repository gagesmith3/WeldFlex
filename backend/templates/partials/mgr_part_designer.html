<div class="pd-shell">

  <!-- ── Left: part list ──────────────────────────────────────── -->
  <div class="pd-panel pd-left">
    <div class="pd-panel-header">
      <span class="pd-panel-title">Parts</span>
      <button type="button" class="pd-icon-btn" title="New part" onclick="pdNewPart()">
        {{ icon_safe('plus', width=13, height=13) }}
      </button>
    </div>
    <div class="pd-panel-body">
      <div id="pd-part-list"></div>
    </div>
  </div>

  <!-- ── Center: canvas ───────────────────────────────────────── -->
  <div class="pd-canvas-area">
    <button type="button" class="pd-tool-btn save pd-hidden pd-save-float" id="pd-save-btn" onclick="pdSave()">
      {{ icon_safe('save', width=13, height=13) }}
      Save
    </button>
    <div class="pd-canvas-stage">
      <svg id="pd-bed" viewBox="0 0 508 508" preserveAspectRatio="xMidYMid meet"
           xmlns="http://www.w3.org/2000/svg">
        <g id="pd-grid"></g>
        <g id="pd-path"></g>
        <g id="pd-points"></g>
      </svg>
    </div>
    <div class="pd-canvas-coords" id="pd-coords">508 × 508 mm bed</div>
  </div>

  <!-- ── Right: stud list ─────────────────────────────────────── -->
  <div class="pd-panel pd-right">
    <div class="pd-panel-header">
      <span class="pd-panel-title">Studs</span>
      <span class="pd-stud-count-badge" id="pd-stud-count"></span>
    </div>
    <div class="pd-panel-body pd-stud-list-body" id="pd-stud-list"></div>
    <div class="pd-panel-footer">
      <button type="button" class="pd-panel-footer-btn" onclick="pdAddPoint()">
        {{ icon_safe('plus_circle', width=12, height=12) }}
        Add Stud
      </button>
      <button type="button" class="pd-panel-footer-btn">
        {{ icon_safe('pause', width=12, height=12) }}
        Add Pause
      </button>
    </div>
  </div>

</div>

<div class="pd-tooltip pd-hidden" id="pd-tooltip"></div>

<!-- New Part modal -->
<div id="pd-create-modal" class="wf-modal-overlay" hidden>
  <div class="wf-modal">
    <p class="wf-modal-msg">New Part</p>
    <input type="text" id="pd-create-name" class="pd-create-input"
           placeholder="Part name…" maxlength="64" autocomplete="off">
    <div class="wf-modal-actions">
      <button type="button" class="btn wf-cancel" onclick="pdCancelCreate()">Cancel</button>
      <button type="button" class="btn run" onclick="pdConfirmCreate()">Create</button>
    </div>
  </div>
</div>

<!-- Delete Part modal -->
<div id="pd-delete-modal" class="wf-modal-overlay" hidden>
  <div class="wf-modal">
    <p class="wf-modal-msg">Delete "<span id="pd-delete-part-name"></span>"?</p>
    <p class="pd-delete-warning">This cannot be undone. Type <strong>DELETE</strong> to confirm.</p>
    <input type="text" id="pd-delete-confirm-input" class="pd-create-input"
           placeholder="Type DELETE" autocomplete="off">
    <div class="wf-modal-actions">
      <button type="button" class="btn wf-cancel" onclick="pdCancelDelete()">Cancel</button>
      <button type="button" class="btn stop" id="pd-delete-confirm-btn" onclick="pdConfirmDelete()" disabled>Delete</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/part_designer.js') }}"></script>
<script>pdInit();</script>
