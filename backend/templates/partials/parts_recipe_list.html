{% if recipes %}
  {% for recipe in recipes %}
  <button class="recipe-list-item"
          hx-post="/ui/parts/load"
          hx-vals='{"recipe_name": "{{ recipe.name }}"}'
          hx-target="#parts-editor"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful){setActiveRecipe(this)}">
    <span class="recipe-item-name">{{ recipe.name }}</span>
    <span class="recipe-item-meta">{{ recipe.studs_count }}&thinsp;studs</span>
  </button>
  {% endfor %}
{% else %}
  <p class="panel-note">No parts yet.</p>
{% endif %}
