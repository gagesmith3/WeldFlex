{% if recipes %}
<div class="table-shell parts-library-shell">
  <table class="library-table parts-library-table">
    <thead>
      <tr>
        <th>Part</th>
        <th>Studs</th>
        <th>Updated</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for recipe in recipes %}
      <tr>
        <td class="parts-library-name-cell">{{ recipe.name }}</td>
        <td class="parts-library-studs-cell">{{ recipe.studs_count }}</td>
        <td class="parts-library-date-cell">{{ recipe.updated_label }}</td>
        <td class="parts-library-action-cell">
          <button type="button" class="btn run js-table-run parts-run-btn"
                  data-recipe-id="{{ recipe.id }}"
                  data-recipe-name="{{ recipe.name }}">Run</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="parts-library-empty">
  <p class="panel-note">No parts yet. Create your first one to start building.</p>
</div>
{% endif %}
