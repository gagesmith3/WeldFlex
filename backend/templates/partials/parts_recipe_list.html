{% if recipes %}
<div class="table-shell parts-library-shell">
  <table class="library-table parts-library-table">
    <thead>
      <tr>
        <th>Part</th>
        <th>Studs</th>
        <th>Updated</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for recipe in recipes %}
      <tr>
        <td class="parts-library-name-cell">{{ recipe.name }}</td>
        <td>{{ recipe.studs_count }}</td>
        <td>{{ recipe.updated_label }}</td>
        <td class="parts-library-action-cell">
          <div style="display: flex; gap: 8px; align-items: center;">
            <a class="btn recipe-load" href="/operator/parts?recipe_name={{ recipe.name | urlencode }}">Edit</a>
            <button class="btn run js-table-run" data-recipe="{{ recipe.name }}" style="padding: 12px 24px; font-size: 1.1rem;">Run</button>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="parts-library-empty">
  <p class="panel-note">No parts yet. Create your first one to start building.</p>
</div>
{% endif %}
