{% if ok %}
<div class="preview-card">
  <div class="plot-card plot-card-flat">
    
      <svg class="plot-svg" viewBox="0 0 240 240" role="img" aria-label="Top-down weld location map">
        <rect x="20" y="20" width="200" height="200" class="plot-boundary"></rect>

        <line x1="20" y1="20" x2="20" y2="220" class="plot-grid-line"></line>
        <line x1="120" y1="20" x2="120" y2="220" class="plot-grid-line"></line>
        <line x1="220" y1="20" x2="220" y2="220" class="plot-grid-line plot-axis"></line>
        <line x1="20" y1="20" x2="220" y2="20" class="plot-grid-line"></line>
        <line x1="20" y1="120" x2="220" y2="120" class="plot-grid-line"></line>
        <line x1="20" y1="220" x2="220" y2="220" class="plot-grid-line plot-axis"></line>

        {% for point in preview.graph_points %}
        <circle cx="{{ 20 + point.x_plot }}" cy="{{ 20 + point.y_plot }}" r="5" class="plot-point"></circle>
        <text x="{{ 28 + point.x_plot }}" y="{{ 16 + point.y_plot }}" class="plot-point-label">{{ point.index }}</text>
        {% endfor %}

        <circle cx="220" cy="220" r="5" class="plot-origin"></circle>
        <text x="224" y="232" class="plot-axis-label">0,0</text>
        <text x="4" y="234" class="plot-axis-label">508</text>
        <text x="104" y="234" class="plot-axis-label">254</text>
        <text x="200" y="16" class="plot-axis-label">508</text>
        <text x="200" y="116" class="plot-axis-label">254</text>
      </svg>
    </div>

</div>
{% else %}
<div class="status error">
  <div class="row"><span>Preview</span><strong>Unavailable</strong></div>
  <p>{{ preview.error }}</p>
</div>
{% endif %}
