{% if ok %}
<div class="preview-card">
  <div class="plot-card plot-card-flat">
    
      <svg class="plot-svg" viewBox="0 0 240 240" role="img" aria-label="Top-down weld location map">
        <rect x="20" y="20" width="200" height="200" class="plot-boundary"></rect>

        {# The two edges through the part's 0,0 corner are its axes. #}
        {% for at in (20, 120, 220) %}
        <line x1="{{ at }}" y1="20" x2="{{ at }}" y2="220" class="plot-grid-line{% if at == preview.origin.cx %} plot-axis{% endif %}"></line>
        <line x1="20" y1="{{ at }}" x2="220" y2="{{ at }}" class="plot-grid-line{% if at == preview.origin.cy %} plot-axis{% endif %}"></line>
        {% endfor %}

        {% for point in preview.graph_points %}
        <circle cx="{{ 20 + point.x_plot }}" cy="{{ 20 + point.y_plot }}" r="5" class="plot-point"></circle>
        <text x="{{ 28 + point.x_plot }}" y="{{ 16 + point.y_plot }}" class="plot-point-label">{{ point.index }}</text>
        {% endfor %}

        <circle cx="{{ preview.origin.cx }}" cy="{{ preview.origin.cy }}" r="5" class="plot-origin"></circle>
        {% for label in preview.x_labels %}
        <text x="{{ label.pos }}" y="234" class="plot-axis-label" text-anchor="middle">{{ label.text }}</text>
        {% endfor %}
        {% for label in preview.y_labels %}
        <text x="228" y="{{ label.pos }}" class="plot-axis-label">{{ label.text }}</text>
        {% endfor %}
      </svg>
    </div>

</div>
{% else %}
<div class="status error">
  <div class="row"><span>Preview</span><strong>Unavailable</strong></div>
  <p>{{ preview.error }}</p>
</div>
{% endif %}
