{% extends "base.html" %}

{% block body %}
<div class="parts-body">

  {% if recipe_name is not none %}
    <div class="parts-back-bar">
      <a href="/operator/parts" class="btn parts-back-btn">← Parts</a>
    </div>
    {% include "partials/parts_editor.html" %}

  {% else %}
    <div class="parts-library-view">
      <div class="parts-library-panel">
        <div class="parts-library-table-wrap">
          {% include "partials/parts_recipe_list.html" %}
        </div>
      </div>
    </div>
  {% endif %}

</div>

{% endblock %}

{% block scripts %}
<script defer src="{{ url_for('static', filename='js/coordinate_table.js') }}"></script>
{% if recipe_name is not none %}
<script>
function syncPartsEditorUrl() {
  var el = document.getElementById('recipe_name');
  if (!el) return;
  var url = new URL(window.location.href);
  url.searchParams.set('recipe_name', el.value.trim());
  history.replaceState({}, '', url.toString());
}
</script>
{% endif %}
{% endblock %}
