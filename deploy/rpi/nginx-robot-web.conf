# WeldFlex — local proxy for the FAIRINO controller's web app.
#
# The admin menu's "Robot Web App" page shows the controller's web app in an
# iframe under the WeldFlex header, because the kiosk has no address bar or back
# button: navigating straight to the controller would strand the operator there.
# The controller sends `X-Frame-Options: SAMEORIGIN`, which forbids exactly that
# iframe, so this proxy passes the app through and drops the header.
#
# Bound to loopback only: the kiosk's own Chromium is the one client, and the
# robot network should not be reachable from the office Wi-Fi through the Pi.
# install_rpi_kiosk.sh substitutes ROBOT_IP from .env when it installs this.

server {
    # Both loopbacks: the kiosk loads `localhost`, which may resolve to either.
    listen 127.0.0.1:8081;
    listen [::1]:8081;

    location / {
        proxy_pass http://ROBOT_IP;
        proxy_http_version 1.1;
        proxy_set_header Host ROBOT_IP;
        # The web app may push live state over a websocket on the same port.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;

        # The controller redirects with absolute URLs (Location: http://ROBOT_IP/login.html);
        # point those back at the proxy so the iframe stays framed.
        proxy_redirect http://ROBOT_IP/ /;
        # Login sets `-goahead-session-=…; path=/; domain=ROBOT_IP; httponly`.
        # The browser is talking to the Pi's loopback, so it drops a cookie for ROBOT_IP
        # and every page after login bounced back to login.html (seen 2026-09-23).
        # Rewriting it to domain=127.0.0.1 is not enough — Chromium also rejects
        # an IP in Domain — so the attribute is removed, which makes it a
        # host-only cookie for whatever host the browser used.
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $wf_cookie_no_domain always;

        proxy_hide_header X-Frame-Options;

        # The kiosk has no system keyboard and WeldFlex's cannot reach into a
        # cross-origin frame, so every page gets a bridge that asks the framing
        # WeldFlex page to open its keyboard (backend/static/js/robot_web_bridge.js).
        # sub_filter needs the body uncompressed.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/__weldflex/robot_web_bridge.js"></script></head>';
        sub_filter_once on;
    }

    # Served from WeldFlex so the bridge ships with the app, not with this file.
    location = /__weldflex/robot_web_bridge.js {
        proxy_pass http://127.0.0.1:5000/static/js/robot_web_bridge.js;
    }
}

# After login the app opens its live-state websocket at ws://<page hostname>:9999
# (js/pages/index.js), which from the frame means 127.0.0.1:9999 — this Pi.
# Without this the app sits on its loading screen forever.
server {
    listen 127.0.0.1:9999;
    listen [::1]:9999;

    location / {
        proxy_pass http://ROBOT_IP:9999;
        proxy_http_version 1.1;
        proxy_set_header Host ROBOT_IP:9999;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Upstream Set-Cookie minus its Domain attribute (see the location above). The
# controller sends one Set-Cookie at most; an empty value adds no header.
map $upstream_http_set_cookie $wf_cookie_no_domain {
    "~*^(?<wf_pre>.*?);\s*domain=[^;]*(?<wf_post>.*)$" "$wf_pre$wf_post";
    default $upstream_http_set_cookie;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
